[package]
name = "babbage-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "An exact-arithmetic calculation engine for plain-language lines: percentages, units, money, dates and time zones"
readme = "README.md"
repository = "https://github.com/jrimmer/babbage"
keywords = ["calculator", "arithmetic", "units", "natural-language", "rational"]
categories = ["mathematics", "parser-implementations"]
# The tests carry large corpora and fixtures, and the examples are development probes; neither is part of the library.
exclude = ["tests/**", "examples/**"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
astro-float = "0.9"
chrono-tz = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false }
tz-rs = "0.7"

[dev-dependencies]
proptest = "1"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
