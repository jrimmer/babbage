[workspace]
members = ["crates/babbage-core", "crates/babbage-store", "crates/babbage-app", "crates/babbage-accept"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
babbage-core = { path = "crates/babbage-core" }
babbage-store = { path = "crates/babbage-store" }
anyhow = "1"
futures = "0.3"
gpui = "=0.2.2"
# Pinned: gpui's xattr dependency does not build with newer libc.
libc = "=0.2.186"
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"

[profile.test]
opt-level = 2

[profile.release]
debug = false
